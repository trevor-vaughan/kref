name: release

on:
  push:
    tags: ["v*"]

# contents: write — create the GitHub Release
# id-token: write — the OIDC token both cosign (keyless signing) and the
#   provenance attestation exchange for a short-lived Sigstore certificate
# attestations: write — actions/attest-build-provenance
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # cache: false — a tag-triggered release must not read a module cache a
      # branch build could have poisoned (zizmor cache-poisoning).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision pinned tools (betterleaks, ginkgoleaf, golangci-lint, govulncheck)
        run: task dev:tools

      # A tag can be pushed from any commit, not only one that already went
      # green on main. Gate the release on the same checks a PR must pass, so a
      # signed and attested artifact is never built from an unverified tree.
      - name: Quality gate (fmt, vet, govulncheck, all suites under -race incl. e2e)
        run: task check

      # syft on PATH for GoReleaser's `sboms` stanza
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # cosign on PATH for GoReleaser's `signs` stanza; it signs keylessly
      # against this job's OIDC token, so no signing key is stored anywhere.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this, GoReleaser derives the release tag from git state:
          # `git tag --points-at HEAD --sort -version:refname`, first line wins.
          # That sort is not semver-aware, so when v0.1.0 and v0.1.0-rc2 both
          # pointed at one commit it ranked the -rc higher and re-published the
          # rc release, failing on already_exists. Pin the release to the tag
          # that triggered this run.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # SLSA build provenance over every file the release publishes: the
      # archives, their SBOMs, checksums.txt, and the cosign bundle. The action
      # takes exactly one subject selector, so these globs are used rather than
      # `subject-checksums: dist/checksums.txt` — the digests inside that file
      # cover the archives and SBOMs but not checksums.txt or its signature.
      # Verify a download with:
      #   gh attestation verify <artifact> --repo trevor-vaughan/kref
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
