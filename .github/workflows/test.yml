name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.7", "stable"]
    steps:
      # Floating tags kept intentionally so this internal CI tracks the latest
      # toolchain/test images; unpinned-uses suppressed per that decision.
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7 # zizmor: ignore[unpinned-uses]
        with:
          go-version: ${{ matrix.go }}

      # setup-go unconditionally exports GOTOOLCHAIN=local, which forbids Go
      # from provisioning the toolchain go.mod asks for. `stable` resolves out
      # of the actions/go-versions manifest, which lags upstream — it tops out
      # at 1.26.6 today while go.mod requires 1.26.7 — so every `go` command in
      # that leg aborts before it runs. Restoring `auto` makes the leg test the
      # newest Go that satisfies go.mod rather than fail outright, and is a
      # no-op for the pinned leg, where setup-go installs go.mod's version.
      #
      # This has to go through GITHUB_ENV: a job-level `env:` lands in the same
      # dictionary GITHUB_ENV writes to, so setup-go's export — which runs after
      # job setup — would simply overwrite it.
      - name: Let Go provision the toolchain go.mod requires
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - uses: arduino/setup-task@v3 # zizmor: ignore[unpinned-uses]
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provision pinned tools (betterleaks, ginkgoleaf, golangci-lint)
        run: task dev:tools

      # Tidiness is Go-version-sensitive; run it only in the go.mod-pinned leg so
      # the floating `stable` toolchain can't turn PRs red on tidy-output drift.
      - name: Verify go.mod is tidy
        if: matrix.go == '1.26.7'
        run: |
          go mod tidy
          git diff --exit-code

      # FORMAT=github makes ginkgoleaf emit GitHub Actions annotations
      # (::group::/::error::) for the suite results; EXTRA carries the CI-only
      # race/shuffle/coverage flags through to `go test`.
      - name: Test (unit + e2e, race, shuffle, coverage; ginkgoleaf GitHub annotations)
        run: task dev:test:e2e FORMAT=github MODE=llm EXTRA="-race -shuffle=on -coverprofile=coverage.out"

      # Merged coverage profile plus the per-package ginkgoleaf JSON reports;
      # uploaded even when suites fail so failures stay inspectable.
      - name: Upload coverage and suite reports
        if: always()
        uses: actions/upload-artifact@v7 # zizmor: ignore[unpinned-uses]
        with:
          name: test-results-go-${{ matrix.go }}
          path: |
            coverage.out
            .test-output/reports/
          if-no-files-found: ignore
          retention-days: 14

  # Build every target the release builds, using the release config itself so the
  # two cannot drift. The unit suite only ever compiles for the runner's GOOS, so
  # a platform-specific compile error (a syscall field that exists only on unix,
  # say) would otherwise stay invisible until the release tag runs — at which
  # point it fails the release outright and publishes nothing.
  crosscompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          fetch-depth: 0
          persist-credentials: false

      # cache: false — GoReleaser makes this a publishing job as far as
      # zizmor's cache-poisoning audit is concerned, and the audit cannot see
      # that `build --snapshot` publishes nothing. Disabling the cache answers
      # it the same way release.yml does, and keeps this rehearsal faithful:
      # the release builds with no cache, so this must too, or a dependency
      # that only resolves from a warm cache would pass here and fail there.
      - uses: actions/setup-go@v7 # zizmor: ignore[unpinned-uses]
        with:
          go-version-file: go.mod
          cache: false

      - uses: goreleaser/goreleaser-action@v7 # zizmor: ignore[unpinned-uses]
        with:
          version: "~> v2"
          args: build --snapshot --clean
