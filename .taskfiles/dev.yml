version: "3"

vars:
  BIN: '{{.BIN | default "kref"}}'
  BIN_DIR: '{{.BIN_DIR | default (printf "%s/bin" .ROOT_DIR)}}'
  TEST_DIR: '{{.TEST_DIR | default (printf "%s/.test-output" .ROOT_DIR)}}'
  BETTERLEAKS_VERSION: '{{.BETTERLEAKS_VERSION | default "v1.6.1"}}'
  GINKGOLEAF_VERSION: '{{.GINKGOLEAF_VERSION | default "v0.1.1"}}'
  GOLANGCI_LINT_VERSION: '{{.GOLANGCI_LINT_VERSION | default "v2.12.2"}}'
  GOVULNCHECK_VERSION: '{{.GOVULNCHECK_VERSION | default "v1.5.0"}}'

# Every `go` invocation checks the go.mod toolchain directive; provision it.
env:
  GOTOOLCHAIN: auto

tasks:
  default:
    silent: true
    cmd: task dev --list

  tools:
    desc: Install pinned project tools (betterleaks, ginkgoleaf, golangci-lint, govulncheck) into ./bin
    env:
      # Link the installed binaries through a repo-local temp dir so they inherit
      # the repo's SELinux label (container_file_t). Go's default temp is /tmp,
      # which on the dev container is fusefs and yields user_tmp_t binaries the
      # container's policy can't exec or stat. Mirrors dev:build; lives under the
      # git-ignored ./bin so it needs no .gitignore entry.
      GOTMPDIR: "{{.BIN_DIR}}/.gotmp"
    cmds:
      - mkdir -p '{{.BIN_DIR}}/.gotmp'
      # betterleaks is the secret scanner (a drop-in successor to gitleaks by the
      # same author): it reuses the gitleaks v8 report schema and CLI flags. The
      # release pages do not advertise `go install`, but the module's main is at
      # the repo root, so installing the pinned tag works and stays reproducible.
      - GOBIN={{.BIN_DIR}} go install github.com/betterleaks/betterleaks@{{.BETTERLEAKS_VERSION}}
      # ginkgoleaf renders Ginkgo's JSON report into a chosen format (tree for
      # humans, github for CI annotations). Pinned to a tagged release so every
      # run renders identically; the binary stays out of go.mod's requires.
      - GOBIN={{.BIN_DIR}} go install github.com/trevor-vaughan/ginkgoleaf/cmd/ginkgoleaf@{{.GINKGOLEAF_VERSION}}
      # golangci-lint ships as a release binary (upstream does not support
      # `go install` builds); the install script is fetched at the same pinned
      # tag it installs. CI runs the same version via golangci-lint-action.
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/{{.GOLANGCI_LINT_VERSION}}/install.sh | sh -s -- -b {{.BIN_DIR}} {{.GOLANGCI_LINT_VERSION}}
      # govulncheck reports known vulnerabilities in the module graph and, via
      # call-graph analysis, whether the affected symbols are actually reachable.
      # Pinned to the same tag security.yml installs so local `task check` scans
      # match CI byte-for-byte.
      - GOBIN={{.BIN_DIR}} go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
    status:
      - test -x {{.BIN_DIR}}/betterleaks
      - test -x {{.BIN_DIR}}/ginkgoleaf
      - test -x {{.BIN_DIR}}/golangci-lint
      - test -x {{.BIN_DIR}}/govulncheck

  build:
    desc: Build the kref binary into ./bin
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
      # The COMMIT date in UTC RFC3339, matching what goreleaser stamps from
      # .CommitDate. Left empty outside a git checkout (a source tarball), which
      # internal/buildinfo treats as "unknown" and simply omits rather than
      # failing the build.
      DATE:
        sh: TZ=UTC0 git log -1 --date=iso-strict-local --format=%cd 2>/dev/null || true
    env:
      # Build through a repo-local temp dir so the linked binary inherits the
      # repo's SELinux label (container_file_t). Go's default temp is /tmp, which
      # on the dev container is fusefs and yields a user_tmp_t binary that the
      # container's policy blocks from executing. Lives under the git-ignored
      # ./bin so it needs no .gitignore entry.
      GOTMPDIR: "{{.BIN_DIR}}/.gotmp"
    cmds:
      - mkdir -p '{{.BIN_DIR}}/.gotmp'
      - go build -ldflags "-X main.Version={{.VERSION}} -X main.Date={{.DATE}}" -o {{.BIN_DIR}}/{{.BIN}} ./cmd/kref

  # FORMAT selects the ginkgoleaf renderer (tree for humans, github for CI
  # annotations). EXTRA passes through extra `go test` flags (e.g. CI's
  # -race -shuffle=on -coverprofile). MODE=llm drops -v for errors-only output.
  test:
    desc: Run the Ginkgo suites and render with ginkgoleaf (MODE=llm errors-only, FORMAT=github for CI)
    deps: [tools]
    env:
      KREF_BETTERLEAKS: "{{.BIN_DIR}}/betterleaks"
      GINKGOLEAF: "{{.BIN_DIR}}/ginkgoleaf"
      FORMAT: '{{.FORMAT | default "tree"}}'
      OUT_DIR: "{{.TEST_DIR}}"
      # Suites shell out to git (signing, verification, remotes). Without this
      # they read the developer's real config, so a global commit.gpgsign or
      # gpg.format silently changes what they assert — and commits made by
      # fixtures get attributed to a human.
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_AUTHOR_NAME: kref-test
      GIT_AUTHOR_EMAIL: kref-test@invalid
      GIT_COMMITTER_NAME: kref-test
      GIT_COMMITTER_EMAIL: kref-test@invalid
      # Neutralizing the git config is not enough: under gpg.format=openpgp git
      # hands signing to gpg, which reads GNUPGHOME and falls back to
      # $HOME/.gnupg. A signing spec would then read the developer's real keyring
      # and spawn an agent against it. The Go suites isolate this per process too
      # (internal/store isolateGPGHome), so a bare `go test` is covered; this
      # fences the runner script and whatever gets added beside it.
      GNUPGHOME: "{{.TEST_DIR}}/gnupg"
      # kref reads and writes real things under $HOME — its config and identity
      # profiles under XDG_CONFIG_HOME, its scratch tree (entry bodies, secret-scan
      # reports) under XDG_CACHE_HOME, the private-tier vault under XDG_DATA_HOME.
      # Unfenced, the developer's own config decides what the suites assert and the
      # suites write into a tree that is not theirs; both had happened.
      #
      # internal/testenv fences this per test binary, so a bare `go test` is
      # covered. This is the outer fence: it catches the runner script and any
      # suite added without the TestMain hook. XDG_* are named explicitly because a
      # developer's shell often exports XDG_CONFIG_HOME already, and an inherited
      # one points straight back at the real config.
      HOME: "{{.TEST_DIR}}/home"
      XDG_CONFIG_HOME: "{{.TEST_DIR}}/home/.config"
      XDG_CACHE_HOME: "{{.TEST_DIR}}/home/.cache"
      XDG_DATA_HOME: "{{.TEST_DIR}}/home/.local/share"
      XDG_STATE_HOME: "{{.TEST_DIR}}/home/.local/state"
      # Go derives all three from $HOME, so redirecting it without these rebuilds
      # the world and re-downloads the module graph on every run.
      GOCACHE: "{{.GOCACHE}}"
      GOMODCACHE: "{{.GOMODCACHE}}"
      GOPATH: "{{.GOPATH}}"
    vars:
      FLAGS: '{{if eq .MODE "llm"}}-count=1{{else}}-v -count=1{{end}}'
      EXTRA: '{{.EXTRA | default ""}}'
      # Resolved before the HOME above applies, so these name the developer's real
      # caches rather than the throwaway home's empty ones.
      GOCACHE:
        sh: go env GOCACHE
      GOMODCACHE:
        sh: go env GOMODCACHE
      GOPATH:
        sh: go env GOPATH
    cmds:
      # gpg would create this itself, but not before complaining about the
      # permissions if something else made it world-readable first.
      - install -d -m 700 "{{.TEST_DIR}}/gnupg"
      # Private-tier content and scan reports land under here.
      - install -d -m 700 "{{.TEST_DIR}}/home"
      - bash "{{.ROOT_DIR}}/.taskfiles/scripts/run-ginkgo.sh" {{.FLAGS}} {{.EXTRA}} ./...

  test:e2e:
    desc: Run unit + end-to-end suites with ginkgoleaf rendering (builds the binary; slower)
    deps: [tools]
    env:
      KREF_BETTERLEAKS: "{{.BIN_DIR}}/betterleaks"
      GINKGOLEAF: "{{.BIN_DIR}}/ginkgoleaf"
      FORMAT: '{{.FORMAT | default "tree"}}'
      OUT_DIR: "{{.TEST_DIR}}"
      # Same git-config, GPG and home isolation as dev:test — see the notes there.
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_AUTHOR_NAME: kref-test
      GIT_AUTHOR_EMAIL: kref-test@invalid
      GIT_COMMITTER_NAME: kref-test
      GIT_COMMITTER_EMAIL: kref-test@invalid
      GNUPGHOME: "{{.TEST_DIR}}/gnupg"
      HOME: "{{.TEST_DIR}}/home"
      XDG_CONFIG_HOME: "{{.TEST_DIR}}/home/.config"
      XDG_CACHE_HOME: "{{.TEST_DIR}}/home/.cache"
      XDG_DATA_HOME: "{{.TEST_DIR}}/home/.local/share"
      XDG_STATE_HOME: "{{.TEST_DIR}}/home/.local/state"
      GOCACHE: "{{.GOCACHE}}"
      GOMODCACHE: "{{.GOMODCACHE}}"
      GOPATH: "{{.GOPATH}}"
    vars:
      FLAGS: '{{if eq .MODE "llm"}}-count=1{{else}}-v -count=1{{end}}'
      EXTRA: '{{.EXTRA | default ""}}'
      GOCACHE:
        sh: go env GOCACHE
      GOMODCACHE:
        sh: go env GOMODCACHE
      GOPATH:
        sh: go env GOPATH
    cmds:
      - install -d -m 700 "{{.TEST_DIR}}/gnupg"
      - install -d -m 700 "{{.TEST_DIR}}/home"
      - bash "{{.ROOT_DIR}}/.taskfiles/scripts/run-ginkgo.sh" -tags e2e {{.FLAGS}} {{.EXTRA}} ./...

  # Renders the VHS demo tapes in .taskfiles/demo/ into docs/demo/*.gif. Each tape
  # records against a throwaway git repo (see .taskfiles/scripts/demo.sh), so it
  # never touches the working tree. Needs vhs, ttyd, and ffmpeg on PATH (install
  # vhs with `go install github.com/charmbracelet/vhs@latest`, or drop it in ./bin);
  # ttyd and ffmpeg come from your package manager.
  demo:
    desc: Render the VHS demo GIFs into docs/demo (needs vhs, ttyd, ffmpeg on PATH)
    deps: [tools]
    vars:
      DEMO_DIR: "{{.ROOT_DIR}}/docs/demo"
      TAPE_DIR: "{{.ROOT_DIR}}/.taskfiles/demo"
      SCRIPT: "{{.ROOT_DIR}}/.taskfiles/scripts/demo.sh"
    cmds:
      - bash "{{.SCRIPT}}" "{{.ROOT_DIR}}" tour    "{{.TAPE_DIR}}/tour.tape"    "{{.DEMO_DIR}}/tour.gif"
      - bash "{{.SCRIPT}}" "{{.ROOT_DIR}}" secrets "{{.TAPE_DIR}}/secrets.tape" "{{.DEMO_DIR}}/secrets.gif"

  lint:
    desc: Vet, format-check, and golangci-lint
    deps: [tools]
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)"
      - "{{.BIN_DIR}}/golangci-lint run"

  vuln:
    desc: Scan the module graph for known vulnerabilities (govulncheck)
    deps: [tools]
    cmds:
      - "{{.BIN_DIR}}/govulncheck ./..."

  fmt:
    desc: Format
    cmds:
      - gofmt -w .
